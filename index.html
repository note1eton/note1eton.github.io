<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Community</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>My Community</h1>
  <nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('general')">General</button>
    <button onclick="showSection('projects')">Projects</button>
    <button onclick="showSection('chat')">Chat</button>
    <button onclick="showSection('rules')">Rules</button>
    <span id="userArea"></span>
  </nav>
</header>

<main>
  <section id="home" class="section">
    <h2>Welcome</h2>
    <p>A community built on GitHub Pages.</p>
  </section>

  <section id="general" class="section hidden">
    <h2>General</h2>
    <p>Announcements and general discussion.</p>
  </section>

  <section id="projects" class="section hidden">
    <h2>Projects</h2>
    <p>Share what you're working on.</p>
  </section>

  <section id="chat" class="section hidden">
    <h2>Chat</h2>
    <p>Casual conversation (static for now).</p>
  </section>

  <section id="rules" class="section hidden">
    <h2>Rules</h2>
    <ul>
      <li>Be respectful</li>
      <li>No spam</li>
      <li>Keep it friendly</li>
    </ul>
  </section>

  <section id="auth" class="section hidden">
    <h2>Sign Up / Log In</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
