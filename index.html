<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ilves</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Ilves</h1>
  <nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('community')">Community</button>
    <button onclick="showSection('projects')">Projects</button>
    <button onclick="showSection('rules')">Rules</button>
    <button onclick="showSection('login')">Login</button>
    <span id="userArea"></span>
  </nav>
</header>

<main>
  <section id="home" class="section">
    <h2>Welcome to Ilves</h2>
    <p>The Ilves community hub.</p>
  </section>

  <section id="community" class="section hidden">
    <h2>Community</h2>
    <p>General discussion and updates.</p>
  </section>

  <section id="projects" class="section hidden">
    <h2>Projects</h2>
    <p>Share ideas and work.</p>
  </section>

  <section id="rules" class="section hidden">
    <h2>Rules</h2>
    <ul>
      <li>Respect others</li>
      <li>No spam</li>
      <li>Keep it clean</li>
    </ul>
  </section>

  <section id="login" class="section hidden">
    <h2>Login / Sign Up</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
